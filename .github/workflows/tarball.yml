name: Build and publish tarball

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write        # required for gh release

concurrency:
  group: tarball
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npx @11ty/eleventy

      - name: Stamp the build
        run: echo "${{ github.sha }}" | tee VERSION > _site/.build-sha

      - name: Create tarball
        run: tar -czf site.tar.gz -C _site .

      - name: Publish rolling release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view latest >/dev/null 2>&1 \
            || gh release create latest --title "Latest build" --notes "Rolling deploy artifact"
          gh release upload latest site.tar.gz VERSION --clobber
