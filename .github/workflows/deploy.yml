name: Build

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Set version & date
        id: meta
        run: |
          v=$(date -u '+%Y-%j-%H')
          d=$(date -u '+%Y-%m-%d %H:%M UTC')
          echo "version=$v" >> $GITHUB_OUTPUT
          echo "datetime=$d" >> $GITHUB_OUTPUT

      - name: Create tarball
        run: tar -czf site-latest.tar.gz -C _site .

      - name: Debug tarball contents
        run: tar -tzf site-latest.tar.gz | head -20

      - name: Verify output
        run: ls -lh _site/index.html _site/actualites/index.html site-latest.tar.gz

      - uses: actions/upload-artifact@v4
        with:
          name: site-${{ steps.meta.outputs.version }}
          path: site-latest.tar.gz
          compression-level: 0

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          gh release create latest site-latest.tar.gz \
            --title "${{ steps.meta.outputs.version }}" \
            --notes "Build ${{ steps.meta.outputs.version }} — ${{ steps.meta.outputs.datetime }}

          ### Download
          \`\`\`
          curl -LO ${{ github.server_url }}/${{ github.repository }}/releases/download/latest/site-latest.tar.gz
          \`\`\`
          Do **not** use the Source code archive — use the attached **site.tar.gz** asset."
